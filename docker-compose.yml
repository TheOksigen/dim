name: exam-results

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - private

  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /migrations/0001_exam_results.sql
    networks:
      - private
    restart: "no"

  api:
    build:
      context: ./apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      API_MAX_DB_CONNS: ${API_MAX_DB_CONNS}
      API_MIN_DB_CONNS: ${API_MIN_DB_CONNS}
      API_DB_TIMEOUT: ${API_DB_TIMEOUT}
      API_REQUEST_TIMEOUT: ${API_REQUEST_TIMEOUT}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX}
      API_RATE_LIMIT_WINDOW: ${API_RATE_LIMIT_WINDOW}
      API_CACHE_TTL: ${API_CACHE_TTL}
      API_NEGATIVE_CACHE_TTL: ${API_NEGATIVE_CACHE_TTL}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    environment:
      RESULTS_API_URL: http://api:8080
    ports:
      - "3000:3000"
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

