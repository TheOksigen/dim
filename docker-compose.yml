name: exam-results

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      APP_ENV: production
      HTTP_ADDR: :8080
      REDIS_URL: redis://redis:6379/0
      API_MAX_DB_CONNS: "32"
      API_MIN_DB_CONNS: "4"
      # The configured PostgreSQL is external; 180ms is too short for a normal lookup round trip.
      API_DB_TIMEOUT: 1s
      API_REQUEST_TIMEOUT: 3s
      API_MAX_BODY_BYTES: "1024"
      API_RATE_LIMIT_MAX: "60"
      API_RATE_LIMIT_WINDOW: 1m
      API_CACHE_TTL: 15m
      API_NEGATIVE_CACHE_TTL: 30s
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  redis_data:
