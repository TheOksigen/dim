name: exam-results

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exam_results
      POSTGRES_USER: exam_app
      # Reuse an existing Coolify password when present; otherwise generate one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_HEX_64_POSTGRES}}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - private

  migrate:
    image: postgres:17-alpine
    # This one-shot service exits successfully after applying the schema.
    exclude_from_hc: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: exam_results
      POSTGRES_USER: exam_app
      PGPASSWORD: ${POSTGRES_PASSWORD:-${SERVICE_HEX_64_POSTGRES}}
      PGHOST: postgres
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command:
      - sh
      - -ec
      - psql -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /migrations/0001_exam_results.sql
    networks:
      - private
    restart: "no"

  api:
    build:
      context: ./apps/api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://exam_app:${POSTGRES_PASSWORD:-${SERVICE_HEX_64_POSTGRES}}@postgres:5432/exam_results?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      API_MAX_DB_CONNS: "32"
      API_MIN_DB_CONNS: "4"
      API_DB_TIMEOUT: 180ms
      API_REQUEST_TIMEOUT: 2s
      API_MAX_BODY_BYTES: "1024"
      API_RATE_LIMIT_MAX: "60"
      API_RATE_LIMIT_WINDOW: 1m
      API_CACHE_TTL: 15m
      API_NEGATIVE_CACHE_TTL: 30s
      API_CORS_ORIGINS: https://${SERVICE_FQDN_WEB}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - private

  web:
    build:
      context: ./apps/web
    depends_on:
      - api
    environment:
      RESULTS_API_URL: http://api:8080
    ports:
      - "3000:3000"
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
